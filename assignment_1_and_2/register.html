<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Adventure - Register / Contact</title>
    <link rel="stylesheet" href="register.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Consistent Header (Navbar) -->
    <header id="main-header">
        <div class="logo"><a href="index.html">
                <h2>Outdoor Adventure</h2>
            </a></div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="media.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Projects</a>
            <a href="register.html" class="active">Register</a>
            <a href="contact.html">Contact</a>

        </nav>
    </header>

    <!-- Main Registration Section -->
    <main class="register-container">
        <div class="form-wrapper">
            <h1>Join the Adventure</h1>
            <p>Fill out the form to register for a tour.</p>

            <form action="#" method="POST">
                <!-- Grid Container for Form Fields -->
                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name (Text)</label>
                        <!-- text, required, minlength, maxlength -->
                        <input type="text" placeholder="John Doe" required minlength="3" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <!-- email, required -->
                        <input type="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <!-- password, required -->
                        <input type="password" required>
                    </div>

                    <div class="form-group">
                        <label>Profile Link (URL)</label>
                        <!-- url, readonly -->
                        <input type="url" value="https://adventure.com/user" readonly>
                    </div>

                    <div class="form-group">
                        <label>Age (Number)</label>
                        <!-- number, min, max, required -->
                        <input type="number" min="18" max="65" required>
                    </div>

                    <div class="form-group">
                        <label>Tour Date</label>
                        <!-- date, min, max -->
                        <input type="date" min="2026-10-20" max="2027-12-31" required>
                    </div>

                    <div class="form-group">
                        <label>Preferred Time</label>
                        <!-- time -->
                        <input type="time" required>
                    </div>

                    <div class="form-group">
                        <label>Gear Color</label>
                        <!-- color -->
                        <input type="color" value="#ff5722">
                    </div>

                    <div class="form-group">
                        <label>Fitness Level (Range)</label>
                        <!-- range -->
                        <input type="range" min="1" max="10">
                    </div>

                    <div class="form-group">
                        <label>Upload ID (File)</label>
                        <!-- file -->
                        <input type="file" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Select Tour</label>
                        <!-- select, selected -->
                        <select required>
                            <option value="">Choose a tour...</option>
                            <option value="everest" selected>Everest Base Camp</option>
                            <option value="walking">Walking Holidays</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Special Medical Notes (Textarea)</label>
                        <!-- textarea, disabled -->
                        <textarea disabled rows="3">Medical notes submission is currently disabled.</textarea>
                    </div>
                </div>

                <!-- Radio and Checkbox Group -->
                <div class="extra-group">
                    <p><strong>Gender:</strong></p>
                    <!-- radio, checked -->
                    <input type="radio" name="gender" value="male" checked> Male
                    <input type="radio" name="gender" value="female"> Female
                </div>

                <div class="extra-group">
                    <!-- checkbox, required -->
                    <input type="checkbox" required> I agree to the terms and conditions.
                </div>

                <button type="submit">Submit Registration</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Copyright &copy; 2026 Outdoor Adventure. All rights reserved.</p>
    </footer>

</body>

</html>
